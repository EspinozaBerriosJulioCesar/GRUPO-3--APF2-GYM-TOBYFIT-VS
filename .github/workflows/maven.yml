
name: Java Maven - Pruebas JWT

on:
  push:
    branches:
      - jwt-seguridad
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gym-tobyfit-vs/gym-tobyfit

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: gym-tobyfit-vs/gym-tobyfit/pom.xml

      - name: Compilar y ejecutar pruebas
        run: mvn -B clean verify
