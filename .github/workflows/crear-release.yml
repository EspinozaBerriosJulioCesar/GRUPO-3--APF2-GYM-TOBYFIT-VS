name: Crear Nueva Versión / Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Número de versión (ejemplo: v2.0.0, v1.1.0)'
        required: true
        default: 'v2.0.0'
      titulo:
        description: 'Título de la versión'
        required: true
        default: 'v2.0.0 — Integración con Angular'
      descripcion:
        description: 'Notas o descripción de los cambios'
        required: false
        default: 'Actualización con nuevas funcionalidades y conexión con frontend Angular.'
      es_latest:
        description: '¿Marcar como la versión más reciente (Latest)?'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Validar y Publicar Release
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gym-tobyfit-vs/gym-tobyfit

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: gym-tobyfit-vs/gym-tobyfit/pom.xml

      - name: Ejecutar pruebas y compilar proyecto
        run: mvn -B clean test

      - name: Crear Tag y Release en GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.version }}
          TITLE: ${{ github.event.inputs.titulo }}
          NOTES: ${{ github.event.inputs.descripcion }}
          LATEST: ${{ github.event.inputs.es_latest }}
        run: |
          LATEST_FLAG="--latest"
          if [ "$LATEST" != "true" ]; then
            LATEST_FLAG="--latest=false"
          fi
          
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "$NOTES" \
            $LATEST_FLAG \
            --target main
