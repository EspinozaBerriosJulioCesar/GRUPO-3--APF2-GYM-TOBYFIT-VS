# Perfil local y desechable para ensayar sin instalar MySQL.
spring.datasource.url=jdbc:h2:mem:tobyfit_demo;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
# Esta clave pública de demostración solo se utiliza al activar el perfil demo.
jwt.secret=${JWT_SECRET:clave_solo_demo_tobyfit_jwt_2026_no_usar_en_produccion}
